<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <meta name="robots" content="noindex">
  <title>404 — DOMINUS</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#07090a;--text:#f2eee7;--muted:#aaa39a;--accent:#d6a566;--line:rgba(239,214,176,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(circle at 60% 35%,rgba(139,85,47,.13),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{width:min(760px,100%);padding:clamp(2rem,7vw,5.5rem);border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.018);box-shadow:0 40px 90px rgba(0,0,0,.3)}.eyebrow{color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.2em}.code{margin:.3rem 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(5rem,20vw,11rem);line-height:.85;font-weight:400;letter-spacing:-.05em}.copy{max-width:560px;color:var(--muted);font-size:1.05rem}.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.75rem 1.1rem;border-radius:999px;text-decoration:none;font-weight:650;font-size:.86rem}.primary{background:linear-gradient(135deg,#ead1aa,#c98f51);color:#15100b}.ghost{border:1px solid var(--line);color:#d8d1c7}.button:focus-visible{outline:2px solid #efd6ad;outline-offset:4px}
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">DOMINUS / NAVIGATION</p>
    <h1 class="code">404</h1>
    <p class="copy">This route is not part of the public DOMINUS showcase. Return to the project overview or the wider TheArchitectMax portfolio.</p>
    <div class="actions">
      <a class="button primary" href="./">DOMINUS home</a>
      <a class="button ghost" href="https://thearchitect-max.github.io/MyProjects/">Portfolio HUB</a>
    </div>
  </main>
</body>
</html>
